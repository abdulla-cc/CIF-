[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cif"
version = "0.1.0"
description = "CIF (Crawl, Identify, Fix): accessibility auditor with verified fixes"
requires-python = ">=3.12"
# Exact pins so local, CI and evaluation runs use identical libraries.
dependencies = [
    "fastapi==0.162.3",
    "uvicorn==0.54.0",
    "playwright==1.65.1",
]

[tool.setuptools.package-data]
cif = ["scan/vendor/*"]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",  # required by FastAPI's TestClient (Starlette deprecated httpx)
    "ruff==0.17.4",
    "beautifulsoup4==4.15.0",  # CSS-selector checks on the test site's static HTML
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
