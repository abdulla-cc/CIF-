name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Headless Chromium plus the Linux system libraries it needs, for the scanner tests.
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: pytest -W error
