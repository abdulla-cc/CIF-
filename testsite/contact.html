  </header>
  <main>
    <h1>Contact us</h1>
    <p>Fields in red are required.</p>
    <form action="#" method="post">
      <label for="name" class="required">Name</label>
      <input id="name" name="name" type="text" autocomplete="name">

      <input id="email" name="email" type="email">

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="nope-tel">

      <select id="topic" name="topic">
        <option>Orders</option>
        <option>Rentals</option>
        <option>Other</option>
      </select>

      <input id="order" name="order" type="text" placeholder="Order number">

      <p><button id="send-btn" class="icon icon-send" type="submit"></button></p>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 Fernleaf Outdoor Supply, a fictional shop.
      <a href="https://example.com">Partner site</a> &middot; <a href="private/secret.html">Staff area</a></p>
